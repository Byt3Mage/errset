[package]
name = "errset"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
description = "Unboxed, type-keyed error sets: list a function's errors in its signature without naming an enum"
license = "MIT"
repository = "https://github.com/Byt3Mage/errset"
readme = "README.md"
keywords = ["error", "error-handling", "no-std", "zig", "enum"]
categories = ["rust-patterns", "no-std", "no-std::no-alloc"]

[dev-dependencies]
thiserror = "2"
